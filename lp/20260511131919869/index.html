<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Research – SSD Consulting</title>
<style>
:root {
  --bg: #0a0a0b;
  --bg-elevated: #111114;
  --surface: #16161a;
  --surface-elevated: #1c1c22;
  --text: #f5f5f7;
  --text-secondary: #c7c7cc;
  --text-muted: rgba(245, 245, 247, 0.55);
  --primary: #4d8eff;
  --primary-bright: #5d9eff;
  --primary-dim: rgba(77, 142, 255, 0.12);
  --primary-border: rgba(77, 142, 255, 0.25);
  --accent: #4d8eff;
  --border: rgba(245, 245, 247, 0.08);
  --border-strong: rgba(245, 245, 247, 0.16);
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
@keyframes drawLine {
  from { transform: scaleY(0); }
  to { transform: scaleY(1); }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes slowFloat {
  0%, 100% { transform: translate(0, 0); }
  33% { transform: translate(30px, -20px); }
  66% { transform: translate(-20px, 20px); }
}
@keyframes glow {
  0%, 100% { box-shadow: 0 0 20px var(--primary-dim); }
  50% { box-shadow: 0 0 40px rgba(77, 142, 255, 0.3); }
}
@keyframes rotateBackground {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes rotateSlow {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 18px;
  line-height: 1.6;
  overflow-x: hidden;
  background-image:
    linear-gradient(rgba(245,245,247,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(245,245,247,0.02) 1px, transparent 1px);
  background-size: 64px 64px;
}

.container {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 48px;
}

@media (max-width: 768px) {
  .container { padding: 0 24px; }
}

/* HEADER */
header {
  border-bottom: 1px solid var(--border);
  padding: 24px 0;
  position: relative;
  z-index: 10;
}
